[package]
name = "dutchman-electronics"
description = "Dutchman Electronics: the command Dutchman runs to read circuit boards (Altium .PcbDoc first) into a neutral board model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
board-model = { path = "../board-model" }
altium-pcbdoc = { path = "../altium-pcbdoc", optional = true }

[features]
default = ["altium"]
# One feature per input format, so a build can leave a format out.
altium = ["dep:altium-pcbdoc"]

[lints]
workspace = true
