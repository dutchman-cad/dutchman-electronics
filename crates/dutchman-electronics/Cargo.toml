[package]
name = "dutchman-electronics"
description = "Dutchman Electronics: the command Dutchman runs to read circuit boards (Altium .PcbDoc first) into a neutral board model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
board-model = { path = "../board-model" }
board-step = { path = "../board-step" }
altium-pcbdoc = { path = "../altium-pcbdoc", optional = true }
# Writes the JSON replies Dutchman reads (info, detect, and later the parts manifest).
# MIT or Apache-2.0.
serde_json = "1"
# Unites and cuts the overlay polygons (copper, silkscreen). MIT or Apache-2.0.
geo = { version = "0.33", default-features = false }
# Reads the letter outlines of the TrueType fonts a board embeds. MIT or Apache-2.0, no unsafe
# code, and written for fonts from untrusted sources. Without its default features it parses
# only the tables a glyph outline needs.
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }

[features]
default = ["altium"]
# One feature per input format, so a build can leave a format out.
altium = ["dep:altium-pcbdoc"]

[lints]
workspace = true
