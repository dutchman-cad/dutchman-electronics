[package]
name = "dutchman-electronics"
description = "Dutchman Electronics: reads circuit boards (Altium .PcbDoc first) into a neutral board model for Dutchman"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# Reads the OLE / Compound File Binary container a .PcbDoc is stored in. MIT licensed.
cfb = "0.10"

[features]
default = ["altium"]
# One feature per input format, so a build can leave a format out.
altium = []

[lints]
workspace = true
