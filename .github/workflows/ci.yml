name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Altium runs on Windows, so the reader must work there too.
  test-windows:
    # On main only: hosted Windows and macOS runners are slow, so pull requests test on Linux.
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Board files live anywhere, so the reader must work on macOS too.
  test-macos:
    # On main only: hosted Windows and macOS runners are slow, so pull requests test on Linux.
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The board STEP must open in the readers people will use: SolidCraft (the current release
  # most people have, and the newest one) and cadmpeg. Every test board is opened: the Altium
  # ones, the KiCad CC0 ones and the open-hardware KiCad boards by others.
  board-step-readers:
    runs-on: ubuntu-latest
    env:
      SOLIDCRAFT_VERSIONS: "0.46.2 0.47.0"
      CADMPEG_VERSION: "0.6.12"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p dutchman-electronics
      - name: Cache the readers
        id: readers
        uses: actions/cache@v4
        with:
          path: readers
          key: readers-solidcraft-${{ env.SOLIDCRAFT_VERSIONS }}-cadmpeg-${{ env.CADMPEG_VERSION }}
      - name: Download the readers (checksums verified)
        if: steps.readers.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p readers && cd readers
          for v in $SOLIDCRAFT_VERSIONS; do
            sc="solidcraft-${v}-linux-x86_64.tar.gz"
            gh release download "v${v}" -R tangency-labs/solidcraft -p "$sc" -p SHA256SUMS.txt --clobber
            grep " ${sc}\$" SHA256SUMS.txt | sha256sum -c -
            tar -xzf "$sc" && rm "$sc" SHA256SUMS.txt
          done
          cm="cadmpeg-x86_64-unknown-linux-gnu.tar.xz"
          gh release download "v${CADMPEG_VERSION}" -R cadmpeg/cadmpeg -p "$cm" -p "$cm.sha256"
          echo "$(cut -d' ' -f1 "$cm.sha256")  $cm" | sha256sum -c -
          tar -xf "$cm" && rm "$cm"
      - name: Open every test board (Altium and KiCad) in each SolidCraft and in cadmpeg
        run: |
          set -euo pipefail
          for v in $SOLIDCRAFT_VERSIONS; do
            echo "=== SolidCraft $v"
            scripts/check-board-step.sh target/release/dutchman-electronics \
              "readers/solidcraft-${v}-linux-x86_64/bin/solidcraft-cli" \
              readers/cadmpeg-x86_64-unknown-linux-gnu/cadmpeg
          done
