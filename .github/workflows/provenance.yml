name: Provenance
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reader changes carry the provenance sentence
        env:
          # Passed through the environment, never pasted into the script, so the description
          # cannot inject shell commands.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: scripts/check-provenance.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
