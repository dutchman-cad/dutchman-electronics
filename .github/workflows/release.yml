name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  # A change to the release build itself is built and smoke-tested on every platform before it merges.
  pull_request:
    paths: [".github/workflows/release.yml", "scripts/release.py", "scripts/tests/**"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Test release packaging
        run: python3 -m unittest discover -s scripts/tests -p test_release.py -v
      - id: version
        run: python3 scripts/release.py version >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            container: debian:bookworm
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            container: debian:bookworm
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || '' }}
    timeout-minutes: 180
    steps:
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential python3
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p dutchman-electronics --target ${{ matrix.target }}
      - name: Sign macOS binary
        if: runner.os == 'macOS'
        run: codesign --force --sign - target/${{ matrix.target }}/release/dutchman-electronics
      - name: Smoke-test and package
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/dutchman-electronics"
          if [[ '${{ runner.os }}' == Windows ]]; then binary="$binary.exe"; fi
          python3 scripts/release.py smoke "$binary"
          python3 scripts/release.py package "$binary" '${{ matrix.target }}'
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
      - name: Keep macOS slice for lipo
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: slice-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/dutchman-electronics
          if-no-files-found: error

  universal:
    needs: [version, build]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: slice-*
          path: slices
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Combine, sign, smoke-test and package
        run: |
          lipo -create slices/slice-aarch64-apple-darwin/dutchman-electronics \
            slices/slice-x86_64-apple-darwin/dutchman-electronics -output dutchman-electronics
          chmod +x dutchman-electronics
          codesign --force --sign - dutchman-electronics
          codesign --verify --strict dutchman-electronics
          lipo -verify_arch arm64 x86_64 dutchman-electronics
          python3 scripts/release.py smoke ./dutchman-electronics
          python3 scripts/release.py package ./dutchman-electronics macos-universal
      - uses: actions/upload-artifact@v4
        with:
          name: archive-macos-universal
          path: dist/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [version, build, universal]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          test "$(find dist -name '*.sha256' | wc -l)" -eq 6
          (cd dist && sha256sum --check *.sha256)
          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "Dutchman Electronics $VERSION")
          if [[ "$TAG" == *-rc.* ]]; then args+=(--prerelease); fi
          notes="docs/release-notes/$VERSION.md"
          if [[ -f "$notes" ]]; then args+=(--notes-file "$notes"); else args+=(--notes ""); fi
          gh release create "$TAG" "${args[@]}" dist/*
